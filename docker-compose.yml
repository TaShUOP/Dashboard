version: '3.8'

services:
  siemens-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: siemens-energy-dashboard
    restart: always
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
